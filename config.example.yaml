# tt-autoapply configuration
#
# Copy to config.yaml and edit. The selectors below are PLACEHOLDERS — run
#   tt-autoapply discover
# and paste the real ones in before you trust a run.

profile: profile.yaml

site:
  base_url: https://www.talenttalks.co.uk
  auditions_path: /auditions/
  # Set this if the site has a dedicated sign-in page; otherwise login opens
  # the auditions page and you navigate yourself.
  login_url: https://www.talenttalks.co.uk/login/
  # Your own profile page — the one showing your playing age, height and
  # credits. `tt-autoapply import-profile` reads it to build profile.yaml.
  # profile_url: https://www.talenttalks.co.uk/profile/your-name/
  pagination:
    mode: none        # none | query
    param: page
    max_pages: 3
  request_delay_seconds: 3      # be polite between page loads
  timeout_ms: 30000

browser:
  headless: true
  storage_state: state/session.json
  slow_mo_ms: 0
  # Playwright downloads its own Chromium and uses it automatically. If your
  # OS has no build available (macOS 12 and older), the tool falls back to a
  # Google Chrome / Edge / Brave you already have — no config needed.
  # Set these only to force a specific browser:
  # channel: chrome
  # executable_path: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome

# --- selectors -------------------------------------------------------------
# These are the REAL Talent Talks selectors, read from the live site.
# Each entry is a list of candidates; the first that matches wins.
# Append @attr to read an attribute, e.g. "a.title@href".
selectors:
  # The footer shows "LOGOUT MY ACCOUNT" only when signed in.
  logged_in_marker:
    - "a[href*='logout']"
    - "a[href*='Logout']"
    - "text=LOGOUT MY ACCOUNT"

  listing_ready:
    - "div.white.job.media"

  # 25 of these per page — one per audition.
  listing_item:
    - "div.white.job.media"
    - "div.job-content.media-body"

  title:
    - "h3 a"
    - "h3"

  # Only same-site /audition/ links: the cards also carry a Twitter share link,
  # and a bare "a@href" would grab that instead.
  link:
    - "a[href^='/audition/']@href"

  # Talent Talks puts pay and location in the title and body text rather than
  # in their own elements, so these are best-effort. The matcher reads the full
  # brief text as well, so nothing is lost when they don't match.
  company:
    - ".company"
    - ".client"
  location:
    - ".location"
    - "[class*='location']"
  pay:
    - ".pay"
    - ".fee"
    - "[class*='salary']"
  deadline:
    - ".deadline"
    - "[class*='closing']"
    - "[class*='expiry']"
  posted:
    - "time@datetime"
    - ".posted"
    - "[class*='date']"
  summary:
    - "div.job-content.media-body p"
    - "p"
  tags:
    - ".tag"
    - ".category"

  # Selectors used on an individual audition's page.
  detail:
    description:
      - "div.job-content"
      - "div.job"
      - "article"
      - "#content"
    company:
      - ".company"
    location:
      - ".location"
    pay:
      - ".fee"
    deadline:
      - ".deadline"
      - "[class*='closing']"
    posted:
      - "time@datetime"
      - ".posted"
      - "[class*='date']"
    tags:
      - ".tag"

# --- matching --------------------------------------------------------------
matching:
  mode: rules          # rules | rules+llm | llm
  min_score: 0.6

  # Only go for recent posts. Casting closes fast and a late application to a
  # three-week-old brief is wasted. Uses the date the site shows; where there
  # isn't one, it falls back to when this tool first saw the listing.
  # Set to 0 to turn the freshness filter off entirely.
  max_age_days: 14

  # true = skip any listing with no readable posted date at all. Only worth
  # setting if the board reliably shows dates; otherwise it blocks everything.
  require_posted_date: false
  llm_model: claude-opus-5
  llm_effort: low      # low | medium | high — low is plenty for screening

  # false = re-check every listing on every run, so a brief that was skipped
  # because a run failed part-way (or a listing that was edited after posting)
  # still gets applied to. Set true to save LLM calls on known-bad roles.
  skip_rejected: false

  exclude_nudity: true

  # Skip briefs that specify an ethnicity you don't match. Only triggers when
  # the brief states it as a character requirement — "open to all ethnicities"
  # and incidental words ("black comedy") are ignored.
  ethnicity_filter: true

  exclude_keywords:
    - unpaid
    - student film
    - "no fee"

  require_keywords: []

  pay:
    paid_only: true
    # £ floor, compared against the highest figure in the brief. Leave unset
    # (or comment out) early in your career — a hard floor filters out a lot of
    # low-budget shorts and student films that are still worth the reel footage.
    # min_amount: 100

  location:
    allow_self_tape: true
    allowed:
      - london
      - south east
      - manchester

  # Bonus points for briefs that look like a good fit for you. Anything you'd
  # genuinely go out of your way for belongs here.
  keyword_boosts:
    commercial: 0.15
    "tv drama": 0.2
    "short film": 0.1
    student: 0.05

# --- applying --------------------------------------------------------------
application:
  # NOTE: a Talent Talks audition page carries no <form>, so the apply step
  # isn't a form on the page — it's a link or a button that loads one. Until
  # that's mapped, this stays on `manual`: roles are matched and cover letters
  # drafted, but nothing is submitted. Re-run `tt-autoapply start` to report
  # the apply button, then switch this to `form`.
  mode: manual               # form | email | manual
  require_confirmation: false  # true = prompt before each submission
  cover_letter_template: templates/cover_letter.j2
  screenshot_dir: state/screenshots

  form:
    trigger:
      - "a.apply-button"
      - "button:has-text('Apply')"
    wait_for:
      - "form.application-form"
    fields:
      - selector: ["textarea[name*='message']", "textarea#cover_letter"]
        value: "{{ cover_letter }}"
        optional: false
      - selector: ["input[name*='phone']"]
        value: "{{ profile.phone }}"
        optional: true
    selects: []
    checkboxes:
      - "input[type='checkbox'][name*='terms']"
    uploads:
      - selector: ["input[type='file'][name*='cv']"]
        path: ~/casting/cv.pdf
        optional: true
    submit:
      - "button[type='submit']"
    success:
      - "text=Application sent"
      - ".alert-success"

  # Only used when mode: email
  email:
    from: ${TT_EMAIL_FROM}
    subject: "Application: {{ role.title }} - {{ profile.name }}"
    smtp_host: smtp.gmail.com
    smtp_port: 587
    smtp_user: ${TT_EMAIL_FROM}
    smtp_password: ${TT_EMAIL_PASSWORD}   # an app password, not your login
    attachments:
      - ~/casting/cv.pdf
      - ~/casting/headshot.jpg

# --- limits ----------------------------------------------------------------
limits:
  # 0 = no cap: apply to every brief you fit, which is the point of the tool.
  # Set a number here if you'd rather throttle yourself while you're tuning.
  max_applications_per_run: 0
  max_applications_per_day: 0
  # Kept even when uncapped — this is about not hammering the site with a
  # burst of submissions, not about limiting how many roles you go for.
  seconds_between_applications: 45

# On the very first run, record everything already on the board and apply to
# none of it, so the tool starts watching from now rather than working through
# the back catalogue. Override for one run with --include-existing.
first_run_baseline: true

storage:
  database: state/applications.db

discover:
  output_dir: state/discover

notify:
  console: true
  # webhook_url: https://hooks.slack.com/services/...
  # webhook_field: text
